openapi: "3.0.3"

info:
  title: Ads API
  description: Classified ads — list, read, create, delete, and bulk-import ads.
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [infra]
      responses:
        "200":
          description: Service is up

  /ads:
    get:
      summary: List ads
      operationId: listAds
      tags: [ads]
      parameters:
        - name: title
          in: query
          description: Case-insensitive substring match on the ad title.
          schema:
            type: string
          example: bike
        - name: user_id
          in: query
          description: Filter ads belonging to this owner.
          schema:
            type: string
          example: "00000000-0000-0000-0000-000000000001"
        - name: min_price_cents
          in: query
          description: Inclusive lower bound on the price (in cents). 0 means no lower bound.
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 5000
        - name: max_price_cents
          in: query
          description: Inclusive upper bound on the price (in cents). 0 means no upper bound.
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 50000
      responses:
        "200":
          description: List of matching ads (may be empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdsResponse"
        "400":
          description: Invalid query parameter (e.g. non-numeric price).

    post:
      summary: Create an ad
      operationId: createAd
      tags: [ads]
      security:
        - userID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdBody"
      responses:
        "201":
          description: Ad created. The body contains the generated identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAdResponse"
        "400":
          description: Malformed or unknown request body field, including missing, conflicting, or invalid price fields.
        "401":
          description: Missing Authorization header.
        "500":
          description: Unexpected server error.

  /ads/{adID}:
    parameters:
      - name: adID
        in: path
        required: true
        description: Identifier of the ad.
        schema:
          type: integer
          format: int64
        example: 1

    get:
      summary: Get an ad by ID
      operationId: getAd
      tags: [ ads ]
      responses:
        "200":
          description: The requested ad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAdResponse"
        "400":
          description: adID is not a valid integer.
        "404":
          description: No ad exists with this ID.
        "500":
          description: Unexpected server error.

    delete:
      summary: Delete an ad by ID
      description: Deletes an ad if it belongs to the authenticated user.
      operationId: deleteAd
      tags: [ ads ]
      security:
        - userID: [ ]
      responses:
        "204":
          description: Ad successfully deleted. No response body.
        "400":
          description: adID is not a valid integer.
        "401":
          description: Missing Authorization header.
        "403":
          description: The ad belongs to another user.
        "404":
          description: No ad exists with this ID.
        "500":
          description: Unexpected server error.

  /ads/import:
    post:
      summary: Import multiple ads
      description: |
        Atomically imports multiple ads belonging to the authenticated user.

        All ads are inserted in a single database transaction. If any
        insertion fails, the entire import is rolled back and no ads
        from that request are persisted.

        Clients may provide an optional `Idempotency-Key` header to
        safely retry an import after a timeout or network failure.

        Idempotency keys are scoped to the authenticated user:
        - A new key creates the ads and stores the generated IDs.
        - Repeating the same key with the same payload returns the
          original IDs without creating additional ads.
        - Repeating the same key with a different payload returns
          HTTP 409 Conflict.
        - Different users may use the same key independently.

        Payload comparison uses normalized ad data, so equivalent
        `price` and `price_cents` representations are treated identically.
        The order of ads in the array is significant.

        Without an idempotency key, imports are still atomic, but
        retries may create duplicate ads.

        An empty ads array is accepted and returns an empty IDs array.

        Bulk imports are exempt from the individual ad publication quota.

      operationId: importAds
      tags: [ ads ]

      security:
        - userID: [ ]

      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Optional client-generated identifier for an import operation.

            Reusing this key with an identical payload returns the
            original result. Reusing it with a different payload
            returns HTTP 409 Conflict.

            Keys are scoped to the authenticated user.
          schema:
            type: string
          example: "import-2026-001"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ ads ]
              properties:
                ads:
                  type: array
                  description: |
                    Ads to import. All ads are assigned to the
                    authenticated user.
                  items:
                    $ref: "#/components/schemas/CreateAdBody"

            example:
              ads:
                - title: mountain bike
                  price: 150.50
                  photo_url: https://example.com/bike.jpg
                - title: scooter
                  price: 80.00
                  photo_url: https://example.com/scooter.jpg

      responses:
        "201":
          description: |
            Import completed successfully.

            Returns the generated ad IDs in the same order as the
            request. When replaying a successful import with the
            same idempotency key and payload, the original IDs
            are returned without creating new ads.
          content:
            application/json:
              schema:
                type: object
                required: [ ids ]
                properties:
                  ids:
                    type: array
                    items:
                      type: integer
                      format: int64
              example:
                ids: [ 101, 102 ]

        "400":
          description: |
            Invalid request body, unknown field, or invalid price
            in one or more imported ads. No ads are created.

        "401":
          description: Missing Authorization header.

        "409":
          description: |
            Idempotency key conflict.

            The specified Idempotency-Key has already been used
            by this user for a different import payload.
            No additional ads are created.

        "500":
          description: |
            Unexpected server error.

            The import transaction is rolled back if it has not
            committed. If the client does not receive a response,
            it can safely retry using the same idempotency key.

components:
  securitySchemes:
    userID:
      type: apiKey
      in: header
      name: Authorization
      description: The caller's user ID. No token validation is performed — the value is used as-is as the owner identifier.

  schemas:
    Ad:
      type: object
      required: [id, title, price, price_cents, photo_url, user_id, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: mountain bike
        price:
          type: number
          format: double
          minimum: 0
          description: Price in euros with at most two decimal places.
          example: 150.50
        price_cents:
          type: integer
          format: int64
          deprecated: true
          description: Deprecated. Price in euro cents. Use price instead.
          example: 15050
        photo_url:
          type: string
          example: https://example.com/bike.jpg
        user_id:
          type: string
          example: "00000000-0000-0000-0000-000000000001"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:00:00Z"

    GetAdResponse:
      allOf:
        - $ref: "#/components/schemas/Ad"
        - type: object
          required: [ user_name ]
          properties:
            user_name:
              type: string
              description: Owner's username retrieved from the identity service.
              example: alice

    ListAdsResponse:
      type: object
      required: [ads]
      properties:
        ads:
          type: array
          items:
            $ref: "#/components/schemas/Ad"

    CreateAdBody:
      type: object
      required: [ title, photo_url ]
      properties:
        title:
          type: string
          example: mountain bike
        price:
          type: number
          format: double
          minimum: 0
          description: Price in euros, with at most two decimal places. Exponent notation is not supported.
          example: 150.50
        price_cents:
          type: integer
          format: int64
          minimum: 0
          deprecated: true
          description: Deprecated. Price in euro cents. Use price instead.
          example: 15050
        photo_url:
          type: string
          example: https://example.com/bike.jpg
      oneOf:
        - required: [ price ]
        - required: [ price_cents ]

    CreateAdResponse:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
          description: Generated identifier of the new ad.
          example: 42
